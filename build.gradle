plugins {
    // Plain loom (not the -remap variant the 1.21.4 branch uses): 26.x ships unobfuscated, so there
    // is nothing to remap Minecraft from.
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/releases/" }   // Mod Menu
    maven { url "https://maven.shedaniel.me/" }                  // Cloth Config
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.x ships unobfuscated, so Fabric publishes a placeholder identity intermediary (0.0.0)
    // rather than real mappings — fabric-meta reports it for every 26.x version.
    mappings "net.fabricmc:intermediary:0.0.0:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu + Cloth Config — compile-only so the config-screen entrypoint resolves; optional at
    // runtime (the ModMenu entry no-ops if they're absent). (exclude fabric-api to avoid a 2nd copy.)
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
        exclude(group: "net.fabricmc", module: "fabric-loader")
    }

    // Vivecraft: compile against the production jar. It's compileOnly because at runtime the user
    // launches with the real Vivecraft mod present.
    def vc = file(project.vivecraft_jar)
    if (vc.exists()) {
        modCompileOnly files(vc)
    } else {
        logger.warn("[ViveInterface] Vivecraft jar not found at ${vc} — set 'vivecraft_jar' in gradle.properties.")
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
