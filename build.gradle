plugins {
    // Minecraft 26.x ships UNOBFUSCATED. That changes the whole Loom setup versus the 1.21.4 branch:
    // there are no Mojang mappings and no yarn/intermediary for 26.2, so there is no `mappings` line
    // and dependencies use plain `implementation` rather than `modImplementation` — nothing needs
    // remapping, and asking Loom to remap fails ("Could not find namespace named").
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/releases/" }   // Mod Menu
    maven { url "https://maven.shedaniel.me/" }                  // Cloth Config
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu + Cloth Config — compile-only so the config-screen entrypoint resolves; optional at
    // runtime (the ModMenu entry no-ops if they're absent).
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
        exclude(group: "net.fabricmc", module: "fabric-loader")
    }

    // log4j-core: needed to attach GameLogTap's appender to the game's root logger. Minecraft
    // already ships it at runtime, so this is compile-only.
    compileOnly "org.apache.logging.log4j:log4j-core:2.24.1"

    // Vivecraft: compile against the production jar. compileOnly because at runtime the user launches
    // with the real Vivecraft mod present.
    def vc = file(project.vivecraft_jar)
    if (vc.exists()) {
        compileOnly files(vc)
    } else {
        logger.warn("[ViveInterface] Vivecraft jar not found at ${vc} — set 'vivecraft_jar' in gradle.properties.")
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
