plugins {
    // -remap variant: 1.21.4 is still obfuscated, so Loom remaps Minecraft.
    // (Same plugin the sibling ViveMonkeCraft 1.21.4 project builds with.)
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/releases/" }   // Mod Menu
    maven { url "https://maven.shedaniel.me/" }                  // Cloth Config
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Use official Mojang mappings so Vivecraft's RenderTarget / Vec3 / PoseStack
    // names line up with what we call.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu + Cloth Config — compile-only so the config-screen entrypoint resolves; optional at
    // runtime (the ModMenu entry no-ops if they're absent). (exclude fabric-api to avoid a 2nd copy.)
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
        exclude(group: "net.fabricmc", module: "fabric-loader")   // we already provide the loader
    }

    // log4j-core: needed to attach GameLogTap's appender to the game's root logger. Minecraft
    // already ships it at runtime, so this is compile-only.
    compileOnly "org.apache.logging.log4j:log4j-core:2.24.1"

    // Vivecraft: compile against the production jar. Loom remaps it (intermediary
    // -> mojmap) for the dev classpath. It's compileOnly because at runtime the
    // user launches with the real Vivecraft mod present.
    def vc = file(project.vivecraft_jar)
    if (vc.exists()) {
        modCompileOnly files(vc)
    } else {
        logger.warn("[ViveInterface] Vivecraft jar not found at ${vc} — set 'vivecraft_jar' in gradle.properties.")
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
