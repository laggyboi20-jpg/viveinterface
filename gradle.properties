org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric — Minecraft 26.2. Unlike 1.21.4, 26.x ships unobfuscated, so this branch uses the plain
# `fabric-loom` plugin (the 1.21.4 branch needs `fabric-loom-remap`).
minecraft_version=26.2
loom_version=1.17.17
loader_version=0.19.3

# Fabric API
fabric_version=0.156.0+26.2

# Mod Menu + Cloth Config (compile-only; optional at runtime — drive the settings screen)
modmenu_version=20.0.1
cloth_config_version=26.2.155

# Mod
mod_version=1.0.1-alpha-26.2

maven_group=com.laggy
archives_base_name=viveinterface

# Path to a Vivecraft 26.2 production jar (sibling folder on this machine).
# It's compileOnly — at runtime the user launches with the real Vivecraft mod present.
vivecraft_jar=../Useful Stuff Like sister Mods+/vivecraft-26.2-1.3.15-fabric.jar

